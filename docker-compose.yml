services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: tip-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry_pass}
    ports:
      - "5432:5432"
    volumes:
      # Runs init.sql on first startup to create schema
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemetry_user} -d ${POSTGRES_DB:-telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Zookeeper (required by Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- Kafka Broker ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tip-kafka
    restart: on-failure
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for internal docker traffic, one for host machine access
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Topic Initialization ---
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tip-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic telemetry.raw --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic telemetry.enriched --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic telemetry.dlq --partitions 1 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic anomalies.detected --partitions 3 --replication-factor 1
      echo 'Topics created:'
      kafka-topics --list --bootstrap-server kafka:9092
      echo 'Done.'
      "
  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: tip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  # ============================================================
  # OBSERVABILITY STACK
  # ============================================================

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tip-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9094:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Grafana ---
  grafana:
    image: grafana/grafana:11.1.0
    container_name: tip-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy

  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  # --- API Gateway ---
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: tip-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW: telemetry.raw
      KAFKA_TOPIC_ENRICHED: telemetry.enriched
      KAFKA_TOPIC_DLQ: telemetry.dlq
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ALGORITHM: RS256
      JWT_EXPIRY_MINUTES: 60
      RATE_LIMIT_INGESTION: 1000
      RATE_LIMIT_QUERY: 100
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./keys:/app/keys:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # --- Ingestion Consumer ---
  ingestion-consumer:
    build:
      context: .
      dockerfile: services/ingestion_consumer/Dockerfile
    container_name: tip-ingestion-consumer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW: telemetry.raw
      KAFKA_TOPIC_ENRICHED: telemetry.enriched
      KAFKA_TOPIC_DLQ: telemetry.dlq
      KAFKA_CONSUMER_GROUP: ingestion-consumer-group
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    restart: on-failure

  # --- Anomaly Detection Service ---
  anomaly-detection:
    build:
      context: .
      dockerfile: services/anomaly_detection/Dockerfile
    container_name: tip-anomaly-detection
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_ENRICHED: telemetry.enriched
      KAFKA_TOPIC_ANOMALIES: anomalies.detected
      KAFKA_CONSUMER_GROUP: anomaly-detection-group
      REDIS_URL: redis://redis:6379/0
      WINDOW_SIZE_SECONDS: 300
      MIN_WINDOW_SAMPLES: 10
      Z_SCORE_THRESHOLD_LOW: 2.5
      Z_SCORE_THRESHOLD_MEDIUM: 3
      Z_SCORE_THRESHOLD_HIGH: 3.5
      Z_SCORE_THRESHOLD_CRITICAL: 4
      LOG_LEVEL: INFO
    restart: on-failure

  # --- Telemetry Simulator ---
  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    container_name: tip-simulator
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      API_URL: http://api-gateway:8000
      LOG_LEVEL: INFO
    restart: on-failure
    profiles:
      - simulator

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

  
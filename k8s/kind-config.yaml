# ============================================================
# kind cluster configuration
# ============================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # API Gateway accessible on host port 30080
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Grafana accessible on host port 30030
      - containerPort: 30030
        hostPort: 30030
        protocol: TCP
      # Prometheus accessible on host port 30094
      - containerPort: 30094
        hostPort: 30094
        protocol: TCP

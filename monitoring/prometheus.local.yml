# ============================================================
# Prometheus scrape configuration — LOCAL DEVELOPMENT
# Services run on host machine, scraped via host.docker.internal
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alert_rules.yml
  - /etc/prometheus/custom_rules/custom_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "api-gateway"

  - job_name: "ingestion-consumer"
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: "ingestion-consumer"

  - job_name: "anomaly-detection"
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: "anomaly-detection"

  - job_name: "diagnosis-service"
    static_configs:
      - targets: ["host.docker.internal:9092"]
        labels:
          service: "diagnosis-service"

  - job_name: "alert-receiver"
    static_configs:
      - targets: ["host.docker.internal:9097"]
        labels:
          service: "alert-receiver"

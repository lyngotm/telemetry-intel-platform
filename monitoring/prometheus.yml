# ============================================================
# Prometheus scrape configuration
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alert_rules.yml
  - /etc/prometheus/custom_rules/custom_rules.yml

# --- Alertmanager integration --------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: "api-gateway"

  - job_name: "ingestion-consumer"
    static_configs:
      - targets: ["ingestion-consumer:9090"]
        labels:
          service: "ingestion-consumer"

  - job_name: "anomaly-detection"
    static_configs:
      - targets: ["anomaly-detection:9091"]
        labels:
          service: "anomaly-detection"

  - job_name: "diagnosis-service"
    static_configs:
      - targets: ["diagnosis-service:9092"]
        labels:
          service: "diagnosis-service"

  - job_name: "alert-receiver"
    static_configs:
      - targets: ["alert-receiver:9097"]
        labels:
          service: "alert-receiver"

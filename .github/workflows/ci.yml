# .github/workflows/ci.yml
# CI/CD Pipeline for Telemetry Intelligence Platform
#
# Stages:
#   1. Lint (ruff) — fast syntax/style checks
#   2. Unit Tests — no infrastructure needed
#   3. Build Docker Images — verify all Dockerfiles compile
#   4. Integration Tests — spin up full stack, run tests, tear down
#
# Runs on: push to main, all pull requests
# Target: complete in under 15 minutes

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: .
  # Dummy values for services that need env vars at import time
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: telemetry
  POSTGRES_USER: telemetry_user
  POSTGRES_PASSWORD: telemetry_pass
  KAFKA_BOOTSTRAP_SERVERS: localhost:9093
  REDIS_URL: redis://localhost:6379/0
  JWT_PRIVATE_KEY_PATH: keys/private.pem
  JWT_PUBLIC_KEY_PATH: keys/public.pem
  CHROMA_HOST: localhost
  CHROMA_PORT: 8100
  BEDROCK_MODEL_ID: ""
  BEDROCK_EMBEDDING_MODEL_ID: ""
  EMBEDDING_PROVIDER: local
  LOG_LEVEL: INFO

jobs:
  # ─── Stage 1: Lint ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # ─── Stage 2: Unit Tests ───────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate RSA keys for JWT tests
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Run unit tests
        run: |
          uv run pytest -v -m "not integration and not manual" --tb=short

  # ─── Stage 3: Build Docker Images ─────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build all service images
        run: |
          docker compose build api-gateway
          docker compose build ingestion-consumer
          docker compose build anomaly-detection
          docker compose build diagnosis-service

      - name: Verify images exist
        run: |
          docker images | grep telemetry-intel-platform

  # ─── Stage 4: Integration Tests ───────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, build]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate RSA keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Start infrastructure
        run: |
          docker compose up -d postgres zookeeper kafka kafka-init redis chromadb
          # Wait for services to be healthy
          sleep 30
          docker compose ps

      - name: Start application services
        env:
          EMBEDDING_PROVIDER: local
        run: |
          # Start services in background
          PYTHONPATH=. uv run uvicorn services.api_gateway.app.main:app --port 8000 &
          sleep 5
          PYTHONPATH=. uv run python -m services.ingestion_consumer.app.main &
          sleep 3
          PYTHONPATH=. uv run python -m services.anomaly_detection.app.main &
          sleep 3
          # Skip diagnosis service in CI (requires LLM credentials)
          
          # Wait for API to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "API Gateway ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests (excluding diagnosis)
        run: |
          uv run pytest -v -m "integration and not manual and not call_llm" --tb=short

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          # Kill background processes
          pkill -f "uvicorn" || true
          pkill -f "services.ingestion_consumer" || true
          pkill -f "services.anomaly_detection" || true

